apiVersion: audit.k8s.io/v1
kind: Policy
# Kubernetes API Server Audit Policy
# Target: k8s-guard / k8s-detection-lab
# Purpose: High-fidelity telemetry capture for control-plane threat detection (RBAC escalation, Pod exec, Secret access)

# Stage configuration: Log at RequestReceived and ResponseComplete
omitStages:
  - "RequestReceived"

rules:
  # 1. High-risk mutating and RBAC operations (RequestResponse level captures request body and response)
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: "rbac.authorization.k8s.io"
        resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
      - group: ""
        resources: ["secrets", "configmaps", "serviceaccounts"]

  # 2. Reading secrets and RBAC objects (RequestResponse for credential access audit trail)
  - level: RequestResponse
    verbs: ["get", "list", "watch"]
    resources:
      - group: ""
        resources: ["secrets", "serviceaccounts"]
      - group: "rbac.authorization.k8s.io"
        resources: ["clusterroles", "clusterrolebindings"]

  # 3. Interactive workload access (Metadata level is sufficient to capture who exec'd into what pod)
  - level: Metadata
    verbs: ["create", "get"]
    resources:
      - group: ""
        resources: ["pods/exec", "pods/portforward", "pods/attach"]

  # 4. Filter high-volume system noise to preserve disk space and analysis performance
  - level: None
    users:
      - "system:kube-scheduler"
      - "system:kube-controller-manager"
      - "system:node"
    verbs: ["get", "list", "watch"]
    resources:
      - group: ""
        resources: ["endpoints", "services", "configmaps"]
      - group: "coordination.k8s.io"
        resources: ["leases"]

  - level: None
    nonResourceURLs:
      - "/healthz*"
      - "/version"
      - "/swagger*"
      - "/livez*"
      - "/readyz*"

  # 5. Fallback metadata logging for remaining mutating actions
  - level: Metadata
    verbs: ["create", "update", "patch", "delete"]
